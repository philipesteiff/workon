[package]
name = "workon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wo"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = { version = "0.25", default-features = false, features = ["std", "std-duration"] }
