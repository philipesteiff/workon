[package]
name = "workon"
version = "0.1.2"
edition = "2021"
description = "CLI and compact TUI for creating agent-ready context workspaces"
homepage = "https://github.com/philipesteiff/workon"
repository = "https://github.com/philipesteiff/workon"
license = "Apache-2.0"

[[bin]]
name = "wo"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tachyonfx = { version = "0.25", default-features = false, features = ["std", "std-duration"] }
unicode-width = "0.2"
